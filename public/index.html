<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Committee Donation Form</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --primary-color: #4361ee;
            --secondary-color: #3f37c9;
            --accent-color: #4895ef;
            --light-color: #f8f9fa;
            --dark-color: #212529;
            --success-color: #4cc9f0;
            --error-color: #f72585;
            --warning-color: #f8961e;
            --border-radius: 12px;
            --box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f5f7fa;
            color: var(--dark-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 15px;
        }

        .form-container {
            background-color: rgba(255, 255, 255, 0.92);
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            padding: 25px;
            width: 100%;
            max-width: 500px;
            margin: 15px auto;
            position: relative;
            overflow: hidden;
            transition: var(--transition);
            transform: translateY(0);
            opacity: 1;
            z-index: 10;
        }

        .form-container.hidden {
            transform: translateY(20px);
            opacity: 0;
            pointer-events: none;
            position: absolute;
        }

        .form-container.active {
            transform: translateY(0);
            opacity: 1;
        }
        .whatsapp-instructions {
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: var(--border-radius);
            padding: 15px;
            margin-top: 15px;
            font-size: 0.85rem;
            border: 1px solid var(--success-color);
            display: none;
        }

        h2 {
            color: var(--primary-color);
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
            font-size: 1.5rem;
        }

        .form-group {
            margin-bottom: 15px;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--dark-color);
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: var(--border-radius);
            font-size: 0.95rem;
            transition: var(--transition);
            background-color: rgba(248, 249, 250, 0.8);
        }

        input:focus {
            border-color: var(--primary-color);
            outline: none;
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2);
            background-color: white;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: var(--border-radius);
            background-color: var(--primary-color);
            color: white;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button:hover {
            background-color: var(--secondary-color);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background-color: #adb5bd;
            cursor: not-allowed;
            transform: none;
        }

        button i {
            margin-right: 8px;
            font-size: 0.9rem;
        }

        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: var(--border-radius);
            text-align: center;
            font-weight: 500;
            font-size: 0.9rem;
            background-color: rgba(255, 255, 255, 0.8);
        }

        .success {
            background-color: rgba(76, 201, 240, 0.2);
            color: var(--success-color);
            border: 1px solid var(--success-color);
        }

        .error {
            background-color: rgba(247, 37, 133, 0.2);
            color: var(--error-color);
            border: 1px solid var(--error-color);
        }

        .warning {
            background-color: rgba(248, 150, 30, 0.2);
            color: var(--warning-color);
            border: 1px solid var(--warning-color);
        }

        .auth-toggle {
            text-align: center;
            margin-top: 15px;
            color: var(--dark-color);
            font-size: 0.9rem;
        }

        .auth-toggle a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
        }

        .auth-toggle a:hover {
            text-decoration: underline;
        }

        .confirmation-details {
            margin-bottom: 20px;
        }

        .confirmation-details p {
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
        }

        .confirmation-details strong {
            color: var(--primary-color);
            margin-right: 10px;
        }

        .loader {
            border: 4px solid rgba(67, 97, 238, 0.2);
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .action-buttons button {
            flex: 1 1 100%;
        }

        .secondary-btn {
            background-color: #6c757d;
        }

        .secondary-btn:hover {
            background-color: #5a6268;
        }

        .success-btn {
            background-color: var(--success-color);
        }

        .success-btn:hover {
            background-color: #3aa8d8;
        }

        .submissions-container {
            width: 100%;
            max-width: 1000px;
            background-color: rgba(255, 255, 255, 0.92);
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            padding: 20px;
            margin-top: 15px;
            max-height: 70vh;
            overflow-y: auto;
            z-index: 20;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background-color: rgba(255, 255, 255, 0.8);
            font-size: 0.85rem;
        }

        th, td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid #e9ecef;
        }

        th {
            background-color: rgba(248, 249, 250, 0.8);
            color: var(--primary-color);
            font-weight: 600;
            position: sticky;
            top: 0;
            font-size: 0.9rem;
        }

        tr:hover {
            background-color: rgba(248, 249, 250, 0.6);
        }

        .edit-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
        }

        .edit-btn:hover {
            background-color: #3a7bc8;
        }

        .edit-btn i {
            margin-right: 5px;
        }

        .back-btn {
            margin-bottom: 15px;
            width: auto;
            padding: 8px 15px;
            display: inline-flex;
            font-size: 0.9rem;
        }

        .logo {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo h1 {
            color: var(--primary-color);
            margin-top: 10px;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .progress-bar {
            height: 4px;
            background-color: #e9ecef;
            border-radius: 2px;
            margin-bottom: 15px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            background-color: var(--primary-color);
            width: 0;
            transition: width 0.3s ease;
        }

        .floating-notification {
            position: fixed;
            top: 15px;
            right: 15px;
            background-color: rgba(255, 255, 255, 0.95);
            padding: 12px 15px;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            transform: translateX(120%);
            transition: transform 0.3s ease;
            z-index: 1000;
            display: flex;
            align-items: center;
            max-width: 90%;
        }

        .floating-notification.show {
            transform: translateX(0);
        }

        .floating-notification i {
            margin-right: 8px;
            font-size: 1rem;
        }

        .floating-notification.success {
            border-left: 4px solid var(--success-color);
        }

        .floating-notification.error {
            border-left: 4px solid var(--error-color);
        }

        .slideshow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            overflow: hidden;
        }

        .slideshow img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            filter: brightness(0.8);
        }

        .slideshow img.active {
            opacity: 1;
        }

        .total-row {
            font-weight: 700;
            background-color: rgba(76, 201, 240, 0.2);
        }

        .total-row td {
            padding-top: 12px;
            border-top: 2px solid var(--primary-color);
        }.back-btn {
    background-color: var(--primary-color);
    color: white;
    border: none;
    padding: 10px 15px;
    border-radius: var(--border-radius);
    cursor: pointer;
    transition: var(--transition);
    margin-bottom: 15px;
    display: inline-flex;
    align-items: center;
    font-size: 0.9rem;
}

.back-btn:hover {
    background-color: var(--secondary-color);
    transform: translateY(-2px);
}

.back-btn i {
    margin-right: 8px;
}

        @media (min-width: 768px) {
            .form-container {
                padding: 30px;
            }
            
            .action-buttons button {
                flex: 1;
            }
            
            table {
                font-size: 0.9rem;
            }
            
            th, td {
                padding: 12px 15px;
            }
            
            .edit-btn {
                padding: 8px 12px;
                font-size: 0.85rem;
            }
        }

        /* Animation classes */
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .shake {
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
    </style>
</head>

            <button id="saveWhatsappButton" class="success-btn">

        <!-- Redirect Message -->
        <div class="form-container hidden" id="redirectMessage">
            <h2><i class="fas fa-spinner fa-spin"></i> Processing...</h2>

        <!-- Edit Form -->
        <div class="form-container hidden" id="editForm">
            <h2><i class="fas fa-edit"></i> Edit Submission</h2>

        // Show floating notification
        function showNotification(message, type = 'success') {
            const notification = document.getElementById('floatingNotification');
            const icon = notification.querySelector('i');
            const messageElement = document.getElementById('notificationMessage');
            
            messageElement.textContent = message;
            if (type === 'success') {
                icon.className = 'fas fa-check-circle';
                notification.className = 'floating-notification success';
            } else {
                icon.className = 'fas fa-exclamation-circle';
                notification.className = 'floating-notification error';
            }
            notification.classList.add('show');
            setTimeout(() => notification.classList.remove('show'), 3000);
        }

        // Switch between forms with animation
        function showForm(formId) {
    // Hide all forms
    Object.values(formContainers).forEach(form => {
        if (form) {
            form.classList.add('hidden');
            form.classList.remove('active');
        }
    });

    // Show the requested form
    const formToShow = formContainers[formId] || document.getElementById(formId);
    if (formToShow) {
        setTimeout(() => {
            formToShow.classList.remove('hidden');
            formToShow.classList.add('active');
            updateProgressBar(formId);
        }, 50);
    }
}
        // Update progress bar based on current form
        function updateProgressBar(currentForm) {
            const progressBar = document.getElementById('formProgress');
            let progress = 0;
            if (currentForm === 'loginForm' || currentForm === 'setPasswordForm') progress = 20;
            else if (currentForm === 'customForm') progress = 40;
            else if (currentForm === 'confirmation') progress = 80;
            else if (currentForm === 'redirectMessage') progress = 100;
            progressBar.style.width = `${progress}%`;
        }

        // Toggle between sign in and sign up modes
        function toggleAuthMode(mode) {
    authMode = mode;
    const heading = document.getElementById('loginForm').querySelector('h2');
    const toggleLink = document.getElementById('authToggle');
    const buttonText = document.getElementById('authButtonText');
    const buttonIcon = document.getElementById('authButtonIcon');
    const nameGroup = document.getElementById('signupNameGroup');
    const mobileGroup = document.getElementById('signupMobileGroup');

    if (mode === 'signUp') {
        heading.innerHTML = '<i class="fas fa-user-plus"></i> Committee Member Sign Up';
        toggleLink.innerHTML = 'Already have an account? <a href="#" id="signInLink">Sign in</a>';
        buttonText.textContent = 'Sign Up';
        buttonIcon.className = 'fas fa-user-plus';
        nameGroup.style.display = 'block';
        mobileGroup.style.display = 'block';
        document.getElementById('signupName').required = true;
        document.getElementById('signupMobile').required = true;
    } else {
        heading.innerHTML = '<i class="fas fa-user-circle"></i> Committee Member Login';
        toggleLink.innerHTML = 'Don\'t have an account? <a href="#" id="signUpLink">Sign up</a>';
        buttonText.textContent = 'Login';
        buttonIcon.className = 'fas fa-sign-in-alt';
        nameGroup.style.display = 'none';
        mobileGroup.style.display = 'none';
        document.getElementById('signupName').required = false;
        document.getElementById('signupMobile').required = false;
    }
    document.getElementById('loginMessage').textContent = '';
    document.getElementById('resendVerificationButton').style.display = 'none';
    initializeAuthToggle();
}


        // Handle authentication (login/signup)
        async function handleAuthAction() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const name = document.getElementById('signupName')?.value.trim() || '';
    const mobile = document.getElementById('signupMobile')?.value.trim() || '';
    const loginMessage = document.getElementById('loginMessage');
    const submitButton = document.getElementById('submitAuthButton');
    
    submitButton.disabled = true;
    document.getElementById('authButtonText').textContent = 'Processing...';
    document.getElementById('authButtonIcon').className = 'fas fa-spinner fa-spin';

    try {
        if (authMode === 'signUp') {
            // Validate all fields for signup
            if (!name || !mobile || !email || !password) {
                throw new Error('Please fill all fields');
            }
            if (!/^[6-9]\d{9}$/.test(mobile)) {
                throw new Error('Please enter valid 10-digit Indian mobile number');
            }

            const userCredential = await createUserWithEmailAndPassword(auth, email, password);
            await sendEmailVerification(userCredential.user);
            
            // Save committee member data with name and mobile
            await setDoc(doc(db, 'CommitteeMembers', email), {
                email: email,
                name: name,
                mobile: mobile,
                timestamp: serverTimestamp()
            });
            
            loginMessage.textContent = 'Account created! Please verify your email.';
            loginMessage.className = 'success';
            showNotification('Verification email sent!', 'success');
            await signOut(auth);
            toggleAuthMode('signIn');
        } else {
            // Login logic
            const userCredential = await signInWithEmailAndPassword(auth, email, password);
            const user = userCredential.user;
            
            if (!user.emailVerified) {
                throw new Error('Please verify your email first');
            }
            
            // Get committee member data with proper error handling
            const userDoc = await getDoc(doc(db, 'CommitteeMembers', user.email));
            if (!userDoc.exists()) {
                throw new Error('Committee member data not found');
            }
            
            currentCommitteeMember = {
                email: user.email,
                name: userDoc.data().name,
                mobile: userDoc.data().mobile
            };
            
            showForm('customForm');
            document.getElementById('actionButtons').style.display = 'block';
            showNotification('Login successful!', 'success');
        }
    } catch (error) {
        console.error('Auth error:', error);
        loginMessage.textContent = getFriendlyErrorMessage(error);
        loginMessage.className = 'error';
        loginMessage.classList.add('shake');
        setTimeout(() => loginMessage.classList.remove('shake'), 500);
    } finally {
        submitButton.disabled = false;
        document.getElementById('authButtonText').textContent = authMode === 'signUp' ? 'Sign Up' : 'Login';
        document.getElementById('authButtonIcon').className = authMode === 'signUp' ? 'fas fa-user-plus' : 'fas fa-sign-in-alt';
    }
}

        // Convert Firebase error codes to friendly messages
        function getFriendlyErrorMessage(error) {
            switch (error.code) {
                case 'auth/email-already-in-use':
                    return 'This email is already registered. Please sign in.';
                case 'auth/invalid-email':
                    return 'Please enter a valid email address.';
                case 'auth/weak-password':
                    return 'Password should be at least 6 characters.';
                case 'auth/user-not-found':
                    return 'No account found with this email. Please sign up.';
                case 'auth/wrong-password':
                    return 'Incorrect password. Please try again.';
                case 'auth/too-many-request-requests':
                    return 'Too many attempts. Please try again later.';
                default:
                    return `Authentication failed: ${error.message}`;
            }
        }

        function renderSubmissionsTable() {
            const submissionsContainer = document.getElementById('submissionsContainer');
            
            if (submissionsData.length === 0) {
                submissionsContainer.innerHTML = '<p>No submissions found.</p>';
                return;
            }

            let tableHtml = `
                <button id="backToFormButton" class="back-btn">
                    <i class="fas fa-arrow-left"></i> Back to Donation Form
                </button>
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>City</th>
                            <th>Gothra</th>
                            <th>Amount</th>
                            <th>Phone Number</th>
                            <th>Date</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>`;
            
            submissionsData.forEach(data => {
                tableHtml += `<tr>
                    <td>${data.name || 'N/A'}</td>
                    <td>${data.city || 'N/A'}</td>
                    <td>${data.gothra || 'N/A'}</td>
                    <td>₹${parseFloat(data.amount || 0).toFixed(2)}</td>
                    <td>${data.phoneNumber || 'N/A'}</td>
                    <td>${data.timestamp.toLocaleString()}</td>
                    <td><button class="edit-btn" data-id="${data.id}"><i class="fas fa-edit"></i> Edit</button></td>
                </tr>`;
            });

            const totalAmount = submissionsData.reduce((sum, data) => sum + (parseFloat(data.amount) || 0), 0);
            tableHtml += `<tr class="total-row">
                <td colspan="3">Total</td>
                <td>₹${totalAmount.toFixed(2)}</td>
                <td colspan="3"></td>
            </tr></tbody></table>`;
            
            submissionsContainer.innerHTML = tableHtml;

            // Add event listeners
            document.getElementById('backToFormButton').addEventListener('click', () => {
                showForm('customForm');
                document.getElementById('actionButtons').style.display = 'block';
            });

            document.querySelectorAll('.edit-btn').forEach(button => {
                button.addEventListener('click', () => editSubmission(button.dataset.id));
            });
        }                

        // Edit submission
        function editSubmission(docId) {
            const submission = submissionsData.find(data => data.id === docId);
            if (submission) {
                document.getElementById('editDocId').value = docId;
                document.getElementById('editName').value = submission.name;

                document.getElementById('editAmount').value = submission.amount;
                document.getElementById('editPhoneNumber').value = submission.phoneNumber;
                showForm('editForm');
            }
        }

        // Download XLSX
       function downloadXlsx() {
    const data = submissionsData.map(item => ({
        'Committee Member': currentCommitteeMember || 'N/A',
        'Name': item.name || 'N/A',
        'City': item.city || 'N/A',
        'Gothra': item.gothra || 'N/A',
        'Amount': `₹${parseFloat(item.amount || 0).toFixed(2)}`,
        'Phone Number': item.phoneNumber || 'N/A',
        'Timestamp': item.timestamp instanceof Date ? item.timestamp.toLocaleString() : 'N/A'
    }));
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Submissions');
    XLSX.writeFile(wb, 'donation_submissions.xlsx');
    showNotification('File downloaded successfully!', 'success');
}
